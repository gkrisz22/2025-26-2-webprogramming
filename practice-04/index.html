<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Hangman</h1>
    <div id="controls">
        <button id="start">Start new game</button>
        <div id="result"></div>
    </div>

    <div id="game" style="display: none">
        <table>
            <tr></tr>
        </table>
        <div id="buttons"></div>

        <svg width="200px" height="200px" stroke="black" id="littleMan"></svg>
    </div>

    <svg width="200px" height="200px" stroke="black" style="background-color: #eee;">
        <line x1="0" y1="99%" x2="100%" y2="99%" />
        <line x1="20%" y1="99%" x2="20%" y2="5%" />
        <line x1="20%"" y1="5%" x2="60%" y2="5%" />

        <line x1="60%" y1="5%" x2="60%" y2="20%" />
        <circle cx="60%" cy="30%" r="10%" />
        
        <line x1="60%" y1="30%" x2="60%" y2="70%" />
        <line x1="40%" y1="50%" x2="80%" y2="50%" />
        <line x1="60%" y1="70%" x2="50%" y2="90%" />
        <line x1="60%" y1="70%" x2="70%" y2="90%" />
    
    </svg>
    
    <script src="./main.js"></script>
</body>
</html>
